name: Build KhiCAS CE

on: [push, workflow_dispatch]

jobs:
  build:
    name: "Build KhiCAS ${{ matrix.langname }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - langname: Francais_normal
            buildscript: mkappfr
            bundlename: khicas83.b83
          - langname: English_normal
            buildscript: mkappen
            bundlename: khicas84.b84
          - langname: Francais_light
            buildscript: mkappl2
            bundlename: khicasl2.b83
          - langname: English_light
            buildscript: mkappl
            bundlename: khicasl.b84

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: "Set up shared/ti/ folder"
        run: |
          mkdir -p shared/ti/
          curl -sL https://github.com/YvanTT/arTIfiCE/releases/download/v2.1/arTIfiCE_v2.1.8xp -o shared/ti/arTIfiCE.8xp
          cp app_tools/INST.8xp shared/ti/INST.8xp

      - name: Download and extract nightly CEdev
        run: |
          curl -fsSL https://github.com/CE-Programming/toolchain/releases/download/nightly/CEdev-Linux-nightly.tar.gz | tar -xvzf - -C ~

      - name: Build KhiCAS
        run: |
          export PATH=~/CEdev/bin:$PATH
          ez80-clang --version
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          make clean && ./${{ matrix.buildscript }}
          python3 - <<'PY'
          from pathlib import Path
          size = Path('bin/_KhiCAS.bin').stat().st_size
          count = len(list(Path('bin').glob('AppIns??.8xv')))
          sectors = (size + 3 + 65535) // 65536
          headroom = sectors * 65536 - size - 3
          print(f'Pre-relocated app: {size:,} bytes; {sectors} Flash sectors; '
                f'{headroom:,} bytes headroom; {count} installer AppVars')
          PY

      - name: Prepare files for upload
        run: |
          mkdir upload
          cp -R install_*.txt shared/ti/app shared/ti/*.8x* upload/
          mv upload/app/${{ matrix.bundlename }} upload/
          mv upload KhiCAS_CE_${{ matrix.langname }}
          zip -9r KhiCAS_CE_${{ matrix.langname }}.zip KhiCAS_CE_${{ matrix.langname }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KhiCAS_CE_${{ matrix.langname }}
          path: KhiCAS_CE_${{ matrix.langname }}

      - name: Update nightly release
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: softprops/action-gh-release@5122b4edc95f85501a71628a57dc180a03ec7588 # latest as of 2025-12-22
        with:
          tag_name: nightly
          prerelease: true
          files: |
            KhiCAS_CE_${{ matrix.langname }}.zip
            KhiCAS_CE_${{ matrix.langname }}/${{ matrix.bundlename }}
